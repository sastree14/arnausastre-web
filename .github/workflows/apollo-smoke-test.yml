name: Apollo API Smoke Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apollo-smoke-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apollo-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Apollo secret exists
        env:
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
        run: |
          if [ -z "$APOLLO_API_KEY" ]; then
            echo "::error::APOLLO_API_KEY is not configured"
            exit 1
          fi
          echo "APOLLO_API_KEY is configured (value hidden)."

      - name: Test Apollo authentication, limits and free-plan search access
        env:
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          key = os.environ['APOLLO_API_KEY']
          base = 'https://api.apollo.io'
          headers = {
              'accept': 'application/json',
              'content-type': 'application/json',
              'cache-control': 'no-cache',
              'x-api-key': key,
          }

          def call(label, method, path, body=None):
              data = None if body is None else json.dumps(body).encode('utf-8')
              req = urllib.request.Request(base + path, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      raw = response.read().decode('utf-8', errors='replace')
                      status = response.status
              except urllib.error.HTTPError as exc:
                  status = exc.code
                  raw = exc.read().decode('utf-8', errors='replace')
              except Exception as exc:
                  print(f'{label}: NETWORK_ERROR {type(exc).__name__}: {exc}')
                  return None, None

              try:
                  payload = json.loads(raw) if raw else {}
              except Exception:
                  payload = {'raw': raw[:300]}

              print(f'{label}: HTTP {status}')
              if label == 'auth_health':
                  print('  healthy:', payload.get('healthy'))
                  print('  is_logged_in:', payload.get('is_logged_in'))
              elif label == 'credit_usage':
                  if status == 200:
                      stats = payload.get('credit_usage_stats') or payload.get('usage_stats') or {}
                      safe = {}
                      if isinstance(stats, dict):
                          for k, v in stats.items():
                              if isinstance(v, dict):
                                  safe[k] = {x: v.get(x) for x in ('limit','consumed','left_over') if x in v}
                      print('  credit_summary:', json.dumps(safe, ensure_ascii=False))
                  else:
                      print('  response:', json.dumps(payload, ensure_ascii=False)[:500])
              elif label == 'api_usage':
                  if status == 200:
                      print('  usage endpoint accessible: true')
                      print('  top_level_keys:', sorted(payload.keys()) if isinstance(payload, dict) else [])
                  else:
                      print('  response:', json.dumps(payload, ensure_ascii=False)[:500])
              elif label == 'people_search':
                  if status == 200:
                      people = payload.get('people') or []
                      pagination = payload.get('pagination') or {}
                      print('  search_access: ALLOWED')
                      print('  returned_people:', len(people) if isinstance(people, list) else 'unknown')
                      print('  total_entries:', pagination.get('total_entries'))
                  else:
                      print('  search_access: BLOCKED')
                      print('  response:', json.dumps(payload, ensure_ascii=False)[:500])
              return status, payload

          health_status, health = call('auth_health', 'GET', '/api/v1/auth/health')
          if health_status != 200 or not isinstance(health, dict) or not health.get('healthy') or not health.get('is_logged_in'):
              raise SystemExit('Apollo authentication failed')

          call('credit_usage', 'POST', '/api/v1/usage_stats/credit_usage_stats', {})
          call('api_usage', 'POST', '/api/v1/usage_stats/api_usage_stats', {})

          # People Search costs 0 Apollo credits. Use a single-result request only to test plan access.
          qs = urllib.parse.urlencode({'q_keywords': 'CEO', 'page': 1, 'per_page': 1})
          call('people_search', 'POST', '/api/v1/mixed_people/api_search?' + qs, {})
          PY
