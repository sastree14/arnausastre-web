name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - growth-agent-v2
      - growth-agent-v2-foundation

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  growth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r growth/requirements.txt
      - run: python -m growth.src.cli validate
      - run: pytest -q growth/tests
