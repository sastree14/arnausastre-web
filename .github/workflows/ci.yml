name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - growth-agent-v2
      - growth-agent-v2-foundation
      - growth-agent-v2-integrations

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
      - run: npm install
      - run: npm run lint
      - run: npm run build

  growth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
      - run: npm install
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install -r growth/requirements.txt
      - run: python -m growth.src.cli validate
      - name: Validate complete Knowledge bank
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/content_engine/build_knowledge_bank.py \
            --catalog content/editorial/knowledge_bank_v1.json \
            --output content/article-bank \
            --validate-only
      - run: python -m pytest -q growth/tests
