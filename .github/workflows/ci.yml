name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - growth-agent-v2
      - growth-agent-v2-foundation
      - growth-agent-v2-integrations

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm install
      - run: npm run lint
      - run: npm run build

  growth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm install
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r growth/requirements.txt
      - run: python -m growth.src.cli validate
      - name: Validate complete Knowledge bank
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/content_engine/build_knowledge_bank.py \
            --catalog content/editorial/knowledge_bank_v1.json \
            --output content/article-bank \
            --validate-only
      - run: python -m pytest -q growth/tests
