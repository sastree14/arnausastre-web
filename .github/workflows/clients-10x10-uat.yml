name: Clients 10x10 Prospecting UAT

on:
  push:
    branches: [crm-linkedin-calendly-closure]
    paths:
      - '.github/workflows/clients-10x10-uat.yml'

permissions:
  contents: read

jobs:
  clients-10x10:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: growth/requirements.txt
      - run: pip install -r growth/requirements.txt
      - name: Generate ten direct-client pairs
        run: python -m growth.src.cli prospect --mode lead --limit 10
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          STATE_PROVIDER: supabase
