name: Commercial CRM Prospecting UAT

on:
  push:
    branches: [commercial-crm-workflow-v2]
    paths:
      - '.github/workflows/commercial-crm-uat.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prospecting-uat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: growth/requirements.txt
      - run: pip install -r growth/requirements.txt
      - name: Process queued Commercial CRM task
        run: python -m growth.src.cli run-operator-queue
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GROWTH_ENCRYPTION_KEY: ${{ secrets.GROWTH_ENCRYPTION_KEY }}
          STATE_PROVIDER: supabase
          ASSET_PROVIDER: supabase
          SUPABASE_ASSET_BUCKET: growth-assets
