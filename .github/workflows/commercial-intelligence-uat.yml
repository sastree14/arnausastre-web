name: Commercial Intelligence UAT

on:
  push:
    branches: [commercial-intelligence-engine]
    paths:
      - '.github/workflows/commercial-intelligence-uat.yml'

permissions:
  contents: read

jobs:
  signal-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: growth/requirements.txt
      - run: pip install -r growth/requirements.txt
      - name: Generate five trigger-based commercial signals
        run: python -m growth.src.cli commercial-signals --limit 5
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          STATE_PROVIDER: supabase
