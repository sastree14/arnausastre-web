name: Content pipeline — research & draft one article

on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-article:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/content_engine/requirements.txt

      - name: Check required secrets are present
        run: |
          missing=()
          [ -z "${GOOGLE_SHEETS_CREDENTIALS}" ] && missing+=("GOOGLE_SHEETS_CREDENTIALS")
          [ -z "${EDITORIAL_SHEET_ID}" ] && missing+=("EDITORIAL_SHEET_ID")
          [ -z "${BRAVE_API_KEY}" ] && missing+=("BRAVE_API_KEY")
          [ -z "${GEMINI_API_KEY}" ] && missing+=("GEMINI_API_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Faltan secrets en este repo: ${missing[*]}. Ve a Settings > Secrets and variables > Actions y créalos antes de volver a ejecutar este workflow."
            exit 1
          fi
        env:
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          EDITORIAL_SHEET_ID: ${{ secrets.EDITORIAL_SHEET_ID }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Run research + draft pipeline
        id: pipeline
        run: python scripts/content_engine/run_pipeline.py
        env:
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          EDITORIAL_SHEET_ID: ${{ secrets.EDITORIAL_SHEET_ID }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Check whether there was anything to do
        id: check_output
        run: |
          if [ -f scripts/content_engine/.pipeline_output.json ]; then
            echo "has_article=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_article=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit article draft to editorial branch
        if: steps.check_output.outputs.has_article == 'true'
        id: commit
        run: |
          slug=$(python -c "import json;print(json.load(open('scripts/content_engine/.pipeline_output.json'))['slug'])")

          git config user.name "sc-analytics-content-bot"
          git config user.email "content-bot@users.noreply.github.com"

          # Switch to (or create) the editorial branch
          if git ls-remote --exit-code origin editorial > /dev/null 2>&1; then
            git checkout -b editorial origin/editorial
          else
            git checkout -b editorial
          fi

          git add "content/articles/${slug}.mdx" "public/knowledge/${slug}.svg"
          git commit -m "content: new article draft — ${slug}"
          git push origin editorial

          echo "slug=$slug" >> "$GITHUB_OUTPUT"

      - name: Open or update Pull Request (editorial → main)
        if: steps.check_output.outputs.has_article == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/content_engine/build_pr_text.py
          title=$(cat pr_title.txt)

          # Create PR if one doesn't exist yet; otherwise just push was enough
          existing_pr=$(gh pr list --head editorial --base main --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -z "$existing_pr" ]; then
            pr_full_url=$(gh pr create --title "$title" --body-file pr_body.md --base main --head editorial)
            pr_number=$(echo "$pr_full_url" | grep -oE '[0-9]+$')
          else
            pr_number="$existing_pr"
            pr_full_url="https://github.com/${{ github.repository }}/pull/${pr_number}"
            echo "PR #${pr_number} already exists — article added to editorial branch."
          fi

          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "pr_url=$pr_full_url" >> "$GITHUB_OUTPUT"
          rm -f pr_body.md pr_title.txt

      - name: Update Content Pipeline sheet with PR details
        if: steps.check_output.outputs.has_article == 'true'
        run: |
          row_number=$(python -c "import json;print(json.load(open('scripts/content_engine/.pipeline_output.json'))['pipeline_row_number'])")
          python scripts/content_engine/update_pipeline_status.py \
            "$row_number" \
            "${{ steps.pr.outputs.pr_number }}" \
            "${{ steps.pr.outputs.pr_url }}"
        env:
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          EDITORIAL_SHEET_ID: ${{ secrets.EDITORIAL_SHEET_ID }}

      - name: Summary
        if: always()
        run: python scripts/content_engine/print_summary.py
