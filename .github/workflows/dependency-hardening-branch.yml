name: Temporary dependency hardening

on:
  push:
    branches:
      - growth-agent-v2-robustness
    paths:
      - 'package.json'
      - '.github/workflows/dependency-hardening-branch.yml'

permissions:
  contents: write

jobs:
  harden-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: growth-agent-v2-robustness
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Refresh and audit-fix lockfile
        run: |
          npm install --package-lock-only
          npm audit fix --package-lock-only || true
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run lint
          npm run build
      - name: Commit lockfile changes
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh lockfile after dependency hardening"
          git push origin HEAD:growth-agent-v2-robustness
