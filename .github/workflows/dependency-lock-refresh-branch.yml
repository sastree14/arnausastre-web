name: Temporary dependency lock refresh

on:
  push:
    branches:
      - growth-agent-v2-style-calibration
    paths:
      - 'package.json'
      - '.github/workflows/dependency-lock-refresh-branch.yml'

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: growth-agent-v2-style-calibration
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Refresh dependency lockfile
        run: npm install --package-lock-only
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh lockfile after security dependency upgrades"
          git push origin HEAD:growth-agent-v2-style-calibration
