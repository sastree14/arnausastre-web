name: SC-Analytics Growth Agent — Approval

on:
  workflow_dispatch:
    inputs:
      approval_id:
        description: 'Approval ID from the Growth Brief / dashboard'
        required: true
        type: string
      decision:
        description: 'Decision'
        required: true
        default: approved
        type: choice
        options:
          - approved
          - rejected

permissions:
  contents: read

jobs:
  decide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install -r growth/requirements.txt
      - name: Record decision
        run: python -m growth.src.cli decide "${{ inputs.approval_id }}" "${{ inputs.decision }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          STATE_PROVIDER: supabase
