name: SC-Analytics Growth Agent — Branch Editorial E2E

on:
  push:
    branches:
      - growth-agent-v2-style-calibration
    paths:
      - '.github/workflows/growth-editorial-e2e-branch.yml'
      - 'growth/brain/**'

permissions:
  contents: read

jobs:
  editorial-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r growth/requirements.txt
      - name: Validate production integration secrets
        run: |
          missing=()
          [ -z "$OPENAI_API_KEY" ] && missing+=("OPENAI_API_KEY")
          [ -z "$BRAVE_API_KEY" ] && missing+=("BRAVE_API_KEY")
          [ -z "$SUPABASE_URL" ] && missing+=("SUPABASE_URL")
          [ -z "$SUPABASE_SECRET_KEY" ] && missing+=("SUPABASE_SECRET_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing integration secrets: ${missing[*]}"
            exit 1
          fi
          echo "Required editorial integration secrets are present."
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      - name: Validate Growth Agent configuration
        run: python -m growth.src.cli validate
      - name: Run controlled real editorial cycle
        run: python -m growth.src.cli editorial-run --signals 12 --briefs 1 --theme ""
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          STATE_PROVIDER: supabase
          ASSET_PROVIDER: supabase
          SUPABASE_ASSET_BUCKET: growth-assets
