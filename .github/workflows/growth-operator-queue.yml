name: SC-Analytics Operating System — Operator Queue

on:
  workflow_dispatch:
  schedule:
    # Reliability sweep. UI actions still try an immediate workflow_dispatch,
    # but queued work is never allowed to wait until the next day if that
    # dispatch credential is missing or temporarily misconfigured.
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: sc-analytics-operator-queue
  cancel-in-progress: false

jobs:
  operator-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: growth/requirements.txt
      - run: pip install -r growth/requirements.txt
      - name: Process operator tasks
        run: python -m growth.src.cli run-operator-queue
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GROWTH_ENCRYPTION_KEY: ${{ secrets.GROWTH_ENCRYPTION_KEY }}
          STATE_PROVIDER: supabase
          ASSET_PROVIDER: supabase
          SUPABASE_ASSET_BUCKET: growth-assets
          LINKEDIN_API_VERSION: ${{ vars.LINKEDIN_API_VERSION || '202608' }}
