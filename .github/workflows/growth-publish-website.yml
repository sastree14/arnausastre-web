name: SC-Analytics Operating System — Publish Website (manual fallback)

permissions:
  contents: read

on:
  workflow_dispatch:

concurrency:
  group: sc-analytics-website-publisher
  cancel-in-progress: false

jobs:
  publish-website:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: growth/requirements.txt
      - run: pip install -r growth/requirements.txt
      - name: Publish due approved website articles
        run: python -m growth.src.cli publish-due-articles
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          STATE_PROVIDER: supabase
          ASSET_PROVIDER: supabase
          SUPABASE_ASSET_BUCKET: growth-assets
