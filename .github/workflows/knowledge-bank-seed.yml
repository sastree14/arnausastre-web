name: SC-Analytics Knowledge Bank — Seed Scheduler

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'staged = load approved content without dates; scheduled = release 5 launch articles and activate the 2/3-day calendar'
        required: true
        default: 'staged'
        type: choice
        options:
          - staged
          - scheduled
      limit:
        description: '0 = all 200 families; useful for controlled tests'
        required: false
        default: '0'
        type: string
  push:
    branches:
      - main
    paths:
      - 'content/article-bank/**'
      - 'content/editorial/knowledge_bank_v1.json'
      - 'scripts/content_engine/build_knowledge_bank.py'
      - 'scripts/content_engine/seed_knowledge_bank.py'
      - '.github/workflows/knowledge-bank-seed.yml'

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: growth/requirements.txt
      - run: pip install -r growth/requirements.txt

      - name: Verify complete article bank
        run: |
          python scripts/content_engine/build_knowledge_bank.py \
            --catalog content/editorial/knowledge_bank_v1.json \
            --output content/article-bank \
            --validate-only

      - name: Dry-run scheduler seed
        run: |
          python scripts/content_engine/seed_knowledge_bank.py \
            --bank content/article-bank \
            --catalog content/editorial/knowledge_bank_v1.json \
            --expected 200 \
            --dry-run

      - name: Resolve seed mode
        id: seed_mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
            echo "limit=${{ inputs.limit }}" >> "$GITHUB_OUTPUT"
          else
            echo "mode=scheduled" >> "$GITHUB_OUTPUT"
            echo "limit=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Seed approved Knowledge content
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          STATE_PROVIDER: supabase
        run: |
          python scripts/content_engine/seed_knowledge_bank.py \
            --bank content/article-bank \
            --catalog content/editorial/knowledge_bank_v1.json \
            --mode "${{ steps.seed_mode.outputs.mode }}" \
            --limit "${{ steps.seed_mode.outputs.limit }}" \
            --expected 200
