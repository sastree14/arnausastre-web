name: SC-Analytics Knowledge Factory — Materialize Article Bank

on:
  workflow_dispatch:
    inputs:
      max_articles:
        description: '0 = build/resume the complete 200-article bank'
        required: false
        default: '0'
        type: string
      workers:
        description: 'Parallel article writers'
        required: false
        default: '6'
        type: string
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sc-analytics-knowledge-factory-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: growth/requirements.txt

      - name: Install runtime dependencies
        run: pip install -r growth/requirements.txt

      - name: Validate generation secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY is required for the Knowledge Factory"
            exit 1
          fi

      - name: Materialize or resume article bank
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          MAX="${{ github.event.inputs.max_articles || '0' }}"
          WORKERS="${{ github.event.inputs.workers || '6' }}"
          python scripts/content_engine/build_knowledge_bank.py \
            --catalog content/editorial/knowledge_bank_v1.json \
            --output content/article-bank \
            --workers "$WORKERS" \
            --profile balanced \
            --max "$MAX"

      - name: Validate complete bank when building all
        if: ${{ github.event.inputs.max_articles == '0' || github.event.inputs.max_articles == '' }}
        run: |
          python scripts/content_engine/build_knowledge_bank.py \
            --catalog content/editorial/knowledge_bank_v1.json \
            --output content/article-bank \
            --validate-only

      - name: Create reviewable Knowledge Factory pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- content/article-bank && [ -z "$(git status --porcelain -- content/article-bank)" ]; then
            echo "Knowledge bank already materialized; nothing to propose."
            exit 0
          fi
          # Never push directly to protected main. Publish generated content
          # on a new branch, then let the usual CI + security checks run.
          branch="automation/knowledge-factory-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "SC-Analytics Knowledge Factory"
          git config user.email "knowledge-factory@users.noreply.github.com"
          git switch -c "$branch"
          git add content/article-bank
          git commit -m "[knowledge-factory] materialize publish-ready Knowledge articles"
          git push origin "HEAD:refs/heads/$branch"
          gh pr create --base main --head "$branch" \
            --title "Knowledge Factory: review generated article bank" \
            --body "Automated draft: materialized Knowledge articles. Please review text, sources and CI results before merging. Generated from workflow run ${GITHUB_RUN_ID}."
