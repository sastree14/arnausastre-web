name: Security dependency lock refresh (one-time)
on:
  push:
    branches:
      - security/hardening-20261105
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: security/hardening-20261105
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Update patched production dependencies
        run: |
          npm install --save-exact next@16.3.6 nodemailer@10.3.1 sharp@0.35.5
          npm install --save-dev --save-exact eslint-config-next@16.3.6
          npm audit fix --omit=dev --no-fund || true
      - name: Display remaining production audit findings
        run: npm audit --omit=dev --audit-level=high || true
      - name: Commit deterministic package changes back to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "security: refresh patched dependency lockfile [skip ci]"
            git push origin HEAD:security/hardening-20261105
          fi
