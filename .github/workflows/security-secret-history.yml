name: Security — Secret history scan
on:
  pull_request:
    paths:
      - '**'
  push:
    branches: [main]
  schedule:
    - cron: '21 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-history:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: '8.30.0'
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'false'

  full-history:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Get pinned Gitleaks scanner
        run: |
          curl --fail --silent --show-error --location \
            'https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz' \
            -o /tmp/gitleaks.tgz
          mkdir -p /tmp/gitleaks-scan
          tar -xzf /tmp/gitleaks.tgz -C /tmp/gitleaks-scan gitleaks
      - name: Inspect entire git history without exposing matched tokens
        run: |
          set +e
          /tmp/gitleaks-scan/gitleaks git . --redact=100 --log-level=error \
            --report-format=json --report-path=/tmp/gitleaks-report.json \
            >/dev/null 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'Full Git history: no indicators detected.'
          elif [ "$status" -eq 1 ]; then
            echo 'Potential secret indicators in repository history. Paths/rules only:'
            node -e '
              const fs=require("fs");
              const entries=JSON.parse(fs.readFileSync("/tmp/gitleaks-report.json","utf8"));
              const safe=s=>String(s||"").replace(/[^A-Za-z0-9_./-]/g,"_");
              const items=[...new Set(entries.map(e=>safe(e.File)+":"+safe(e.RuleID)))];
              console.log(items.slice(0,35).join("\\n"));
              const categories=entries.reduce((m,e)=>{const value=String(e.Secret||"");const kind=value.startsWith("sb_publishable_")?"public_supabase_publishable_key":value==="sc-growth-operator-runs-v3"?"local_storage_label":"requires_review";m[kind]=(m[kind]||0)+1;return m},{});
              console.log("Classes (no secret values):",JSON.stringify(categories));
              console.log("Total indicators:",entries.length);
            '
            exit 1
          else
            echo 'Secret scan failed; result not conclusive.'
            exit "$status"
          fi
