name: SEO — visual QA and safe editorial publisher

on:
  pull_request:
    paths:
      - 'scripts/seo_visual_qa.py'
      - 'scripts/seo_editorial_autopublish.py'
      - 'scripts/seo_knowledge_autopublish.py'
      - 'scripts/seo_knowledge_qa.py'
      - 'scripts/requirements-visual-qa.txt'
      - 'scripts/tests/test_seo_visual_qa.py'
      - 'scripts/tests/test_seo_editorial_autopublish.py'
      - 'scripts/tests/test_seo_knowledge_autopublish.py'
      - 'app/internal/seo-preview/**'
      - '.github/workflows/seo-editorial-autopublish.yml'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-editorial-autopublish.yml'
  schedule:
    - cron: '20 9 * * *'

permissions:
  contents: read

concurrency:
  group: sc-seo-editorial-publisher-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  qa-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned browser dependencies
        run: |
          python -m pip install --disable-pip-version-check -r scripts/requirements-visual-qa.txt
          python -m playwright install --with-deps chromium
      - name: Synthetic page browser tests
        run: |
          python -m py_compile scripts/seo_editorial_autopublish.py scripts/seo_visual_qa.py scripts/seo_knowledge_autopublish.py scripts/seo_knowledge_qa.py
          python -m unittest discover -s scripts/tests -p 'test_seo_*.py' -v
      - name: Read-only test against the real website
        run: |
          mkdir -p "$RUNNER_TEMP/seo-visual-qa"
          printf '%s' '{"h1":"Inventory optimization and better operational decisions"}' > "$RUNNER_TEMP/seo-visual-qa/draft.json"
          python scripts/seo_visual_qa.py \
            --url https://www.sc-analytics.io/services/inventory-optimization \
            --draft "$RUNNER_TEMP/seo-visual-qa/draft.json" \
            --out "$RUNNER_TEMP/seo-visual-qa/output"

      - name: Read-only responsive check on an existing Knowledge article
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,'scripts')
          import seo_knowledge_qa as qa
          from playwright.sync_api import sync_playwright
          url=qa.article_url('direct-vs-recursive-multi-step-forecasting','en')
          with sync_playwright() as pw:
              browser=pw.chromium.launch(headless=True)
              for name,(w,h) in qa.SIZES.items():
                  page=browser.new_page(viewport={'width':w,'height':h},reduced_motion='reduce')
                  try:
                      measured=qa.load(page,url)
                      qa.assert_layout(measured)
                      assert measured['lang']=='en',(name,measured.get('lang'))
                  finally:
                      page.close()
              browser.close()
          PY

  publish-existing-pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'sastree14/arnausastre-web'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned browser dependencies
        run: |
          python -m pip install --disable-pip-version-check -r scripts/requirements-visual-qa.txt
          python -m playwright install --with-deps chromium
      - name: Claim one authorized draft and visually verify publishing
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/seo_editorial_autopublish.py
      - name: Claim a Knowledge draft and publish only after browser gate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/seo_knowledge_autopublish.py
