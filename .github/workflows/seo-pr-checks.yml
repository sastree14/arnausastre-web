name: SEO — pull-request safety checks

on:
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'scripts/seo-*.mjs'
      - 'scripts/tests/seo-*.test.mjs'
      - 'package.json'
      - '.github/workflows/seo-*.yml'
      - 'growth/src/seo_*.py'
      - 'growth/tests/test_seo_*.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seo-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install deterministic dependencies
        run: npm ci --no-audit --no-fund
      - name: Run editorial SEO unit tests (no external API)
        run: npm run seo:test
      - name: Audit production dependencies for high and critical advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Compile web without changing production
        run: npm run build

  seo-growth-python:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install deterministic Python requirements
        run: python -m pip install 'requests==2.32.3' 'PyYAML==6.0.2'
      - name: Run growth and SEO safety tests (no backend writes)
        run: python -m unittest discover -s growth/tests -p 'test_seo_*.py' -q

