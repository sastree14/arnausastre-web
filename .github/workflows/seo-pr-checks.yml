name: SEO — pull-request safety checks

on:
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'scripts/seo-*.mjs'
      - 'scripts/tests/seo-*.test.mjs'
      - 'package.json'
      - '.github/workflows/seo-*.yml'
      - 'growth/src/seo_*.py'
      - 'growth/tests/test_seo_*.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seo-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install deterministic dependencies
        run: npm ci --no-audit --no-fund
      - name: Run editorial SEO unit tests (no external API)
        run: npm run seo:test
      - name: Audit production dependencies for high and critical advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Compile web without changing production
        run: npm run build

  seo-growth-python:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install deterministic Python requirements
        run: python -m pip install 'requests==2.32.3' 'PyYAML==6.0.2'
      - name: Run growth and SEO safety tests (no backend writes)
        run: python -m unittest discover -s growth/tests -p 'test_seo_*.py' -q

  one-time-dependency-remediation:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'security/hardening-20261105' && github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: security/hardening-20261105
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: |
          npm install --save-exact next@16.4.5 nodemailer@10.3.1 sharp@0.35.5
          npm install --save-dev --save-exact eslint-config-next@16.4.5
          npm audit fix --omit=dev --no-fund || true
      - name: Commit deterministic dependency fixes to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "security: patched dependency tree [skip ci]"
            git fetch origin security/hardening-20261105
            git rebase origin/security/hardening-20261105
            git push origin HEAD:security/hardening-20261105
          fi
