name: SEO — pull-request safety checks

on:
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'scripts/seo-*.mjs'
      - 'scripts/tests/seo-*.test.mjs'
      - 'package.json'
      - '.github/workflows/seo-*.yml'
      - 'growth/src/seo_*.py'
      - 'growth/tests/test_seo_*.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seo-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install deterministic dependencies
        run: npm ci --no-audit --no-fund
      - name: Run editorial SEO unit tests (no external API)
        run: npm run seo:test
      - name: Compile web without changing production
        run: npm run build

  seo-growth-python:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic Python requirements
        run: python -m pip install 'requests==2.32.3' 'PyYAML==6.0.2'
      - name: Run growth and SEO safety tests (no backend writes)
        run: python -m unittest discover -s growth/tests -p 'test_seo_*.py' -q
