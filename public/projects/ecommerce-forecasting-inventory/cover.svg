  <!-- Confidence band -->
  <path d="M80,310 C160,295 240,270 320,250 C400,230 480,210 560,200 C640,190 700,185 740,182 L740,230 C700,233 640,240 560,252 C480,264 400,282 320,300 C240,318 160,338 80,352 Z" fill="#6366f1" fill-opacity="0.12"/>
